spring:
  application:
    name: getit-qrprofile

  # be/.env 파일에서 DB 접속 정보를 읽어옴 (.env는 git에 올리지 않음)
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5   # Supabase 무료 플랜 연결 수 제한 대비

  jpa:
    hibernate:
      ddl-auto: update        # 개발 중에는 엔티티 기준으로 테이블 자동 생성/수정
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${SHOW_SQL:false}

server:
  port: ${PORT:8080}         # Render 배포 시 PORT 환경변수 사용

app:
  cors:
    # 프론트(Expo) 개발 주소. 여러 개면 쉼표로 구분
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
